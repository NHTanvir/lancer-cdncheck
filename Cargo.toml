[package]
name = "lancer-cdncheck"
version = "0.1.0"
edition = "2021"
description = "Rust clone of cdncheck (CDN/WAF/Cloud detection) with HTTP-probe, bot-protection, ASN enrichment, AI ranking and a native GUI — part of the Lancer bug bounty toolkit"
authors = ["NHTanvir <naymulhasantanvir10@gmail.com>"]
license = "MIT"
repository = "https://github.com/NHTanvir/lancer-cdncheck"

[lib]
name = "lancer_cdncheck"
path = "src/lib.rs"

[[bin]]
name = "lancer-cdncheck"
path = "src/main.rs"

# Companion CLI binary — always runs the CLI surface (for CI / headless / scripting).
[[bin]]
name = "lancer-cdncheck-cli"
path = "src/bin/lancer-cdncheck-cli.rs"

[features]
default = ["gui"]
gui = [
    "dep:eframe",
    "dep:egui",
    "dep:egui_extras",
    "dep:egui_plot",
    "dep:rfd",
    "dep:image",
    "dep:arboard",
    "dep:muda",
    "dep:egui-notify",
    "dep:crossbeam-channel",
]

[dependencies]
# core
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ipnet = "2"
ipnet-trie = "0.3"
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }
colored = "2"
publicsuffix = "2"
once_cell = "1"

# dataset pipeline / probes / enrichment / AI
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls", "stream"] }
futures = "0.3"
regex = "1"
serde_yml = "0.0.12"
scraper = "0.20"
directories = "5"
sha2 = "0.10"

# GUI (optional; on by default)
eframe = { version = "0.28", optional = true }
egui = { version = "0.28", optional = true }
egui_extras = { version = "0.28", optional = true, features = ["all_loaders"] }
egui_plot = { version = "0.28", optional = true }
rfd = { version = "0.14", optional = true }
image = { version = "0.25", optional = true }
arboard = { version = "3", optional = true }
muda = { version = "0.13", optional = true }
egui-notify = { version = "0.15", optional = true }
crossbeam-channel = { version = "0.5", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
