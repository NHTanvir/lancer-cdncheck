# provider.yaml — dataset source-of-truth for lancer-cdncheck
#
# This file is the authoritative input consumed by the dataset generator
# (Phase 3/4). It is parsed by `serde_yml` into the following schema:
#
#   cdn:   { asn: {<provider>: [..]}, urls: {<provider>: [..]}, cidr: {<provider>: [..]} }
#   waf:   { asn: {<provider>: [..]}, urls: {<provider>: [..]}, cidr: {<provider>: [..]} }
#   cloud: { asn: {<provider>: [..]}, urls: {<provider>: [..]}, cidr: {<provider>: [..]} }
#   common:
#     fqdn:
#       <provider>: [ "suffix.example", .. ]
#
# Notes:
#   * `urls` entries are scraped/fetched by the generator and expanded to CIDRs.
#   * `asn` entries are resolved to prefixes via IPinfo / RIR data by the generator.
#   * `cidr` entries are static, hand-curated prefixes that ship as-is.
#   * `common.fqdn` entries are CNAME/SOA suffix signatures matched at runtime.
#   * Unicode provider keys are quoted to remain valid YAML across parsers.
#
# All indentation is 2 spaces. UTF-8. Do not use tabs.

